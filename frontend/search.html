<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<script src="/static/theme.js"></script>
<script src="/static/accent.js"></script>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>DropFix - Search</title>
<link rel="stylesheet" href="/static/style.css">
<link rel="manifest" href="/static/manifest.json">
<meta name="theme-color" content="#34c759">
</head>
<body>

<div id="mode-banner" class="mode-banner">Loading...</div>
<header class="topbar">
  <div class="topbar-row">
    <h1><a href="/" id="brand-link">DropFix</a></h1>
    <nav class="topnav">
      <a href="/">Home</a>
      <a href="/search">Search</a>
      <a href="/about">About</a>
      <a href="/tools" class="tools-link">Tools</a>
    </nav>
  </div>
</header>

<main>
  <h2>Search</h2>
  <div class="reprint-quick">
    <div class="box">
      <h3>Last repair</h3>
      <p id="last-repair-note">Loading...</p>
      <button type="button" id="last-repair-btn" class="full" disabled>Reprint</button>
    </div>
    <div class="box">
      <h3>Last collection receipt</h3>
      <p id="last-collection-note">Loading...</p>
      <button type="button" id="last-collection-btn" class="full" disabled>Reprint</button>
    </div>
    <div class="box">
      <h3>Last sale</h3>
      <p id="last-sale-note">Loading...</p>
      <button type="button" id="last-sale-btn" class="full" disabled>Reprint</button>
    </div>
  </div>

  <div class="search-filters">
    <div class="field grow">
      <label for="search-q">Search</label>
      <input type="text" id="search-q" placeholder="Ticket, name, phone, model, passcode, item, serial...">
    </div>
    <div class="field">
      <label for="search-date-from">From</label>
      <input type="date" id="search-date-from">
    </div>
    <div class="field">
      <label for="search-date-to">To</label>
      <input type="date" id="search-date-to">
    </div>
    <div class="field">
      <label for="search-collected">Collected</label>
      <select id="search-collected">
        <option value="any">Any</option>
        <option value="yes">Collected</option>
        <option value="no">Not Collected</option>
      </select>
    </div>
    <div class="field">
      <label for="search-ready">Ready</label>
      <select id="search-ready">
        <option value="any">Any</option>
        <option value="yes">Ready</option>
        <option value="no">Not Ready</option>
      </select>
    </div>
    <div class="field">
      <label for="search-paid">Paid</label>
      <select id="search-paid">
        <option value="any">Any</option>
        <option value="yes">Paid</option>
        <option value="no">Not Paid</option>
        <option value="unsettled">Unsettled</option>
      </select>
    </div>
  </div>

  <div class="search-columns">
    <div class="result-column">
      <h2>Repairs</h2>
      <!-- The sentinel lives INSIDE the scrolling list (not after it), so
           IntersectionObserver sees it clipped by the list's own scroll
           area and only fires once it actually scrolls into view. -->
      <div class="result-list" id="repairs-list">
        <div id="repairs-rows"></div>
        <div class="load-more-sentinel" id="repairs-sentinel"></div>
      </div>
    </div>
    <div class="result-column">
      <h2>Sales</h2>
      <div class="result-list" id="sales-list">
        <div id="sales-rows"></div>
        <div class="load-more-sentinel" id="sales-sentinel"></div>
      </div>
    </div>
  </div>
</main>

<script src="https://cdn.jsdelivr.net/npm/qz-tray/qz-tray.js"></script>
<script src="/static/api.js"></script>
<script src="/static/pwa.js"></script>
<script src="/static/util.js"></script>
<script src="/static/common.js"></script>
<script src="/static/printing.js"></script>
<script src="/static/search.js"></script>
<script src="/static/reprint.js"></script>
</body>
</html>
