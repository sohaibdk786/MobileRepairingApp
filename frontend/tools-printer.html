<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<script src="/static/theme.js"></script>
<script src="/static/accent.js"></script>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>DropFix - Printer</title>
<link rel="stylesheet" href="/static/style.css">
<link rel="manifest" href="/static/manifest.json">
<meta name="theme-color" content="#34c759">
</head>
<body>

<div id="mode-banner" class="mode-banner">Loading...</div>
<header class="topbar">
  <div class="topbar-row">
    <h1><a href="/" id="brand-link">DropFix</a></h1>
    <nav class="topnav">
      <a href="/">Home</a>
      <a href="/search">Search</a>
      <a href="/about">About</a>
      <a href="/tools" class="tools-link">Tools</a>
    </nav>
  </div>
</header>

<main>
  <a class="tools-back" href="/tools">&larr; Tools</a>
  <h2>Printer</h2>
  <p class="hint">Needs QZ Tray running. New PC or printer: Detect, pick, Test print.</p>

  <div class="box">
    <p>Currently selected: <strong id="printer-current-name">Loading...</strong></p>
    <div class="action-row">
      <button type="button" id="printer-detect-btn" class="secondary">Detect printers</button>
    </div>
    <label id="printer-select-label" class="hidden">Pick a printer
      <select id="printer-select"></select>
    </label>
    <div class="action-row">
      <button type="button" id="printer-save-btn" class="hidden">Save selected printer</button>
      <button type="button" id="printer-test-btn" class="secondary">Test print</button>
    </div>
    <div id="printer-confirmation" class="confirmation hidden"></div>
    <div id="printer-error" class="error hidden"></div>
  </div>
</main>

<script src="https://cdn.jsdelivr.net/npm/qz-tray/qz-tray.js"></script>
<script src="/static/api.js"></script>
<script src="/static/pwa.js"></script>
<script src="/static/common.js"></script>
<script src="/static/printing.js"></script>
<script src="/static/tools-printer.js"></script>
</body>
</html>
