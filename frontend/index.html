<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<script src="/static/theme.js"></script>
<script src="/static/accent.js"></script>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>DropFix</title>
<link rel="stylesheet" href="/static/style.css">
<link rel="manifest" href="/static/manifest.json">
<meta name="theme-color" content="#34c759">
</head>
<body>

<div id="mode-banner" class="mode-banner">Loading...</div>
<header class="topbar">
  <div class="topbar-row">
    <h1><a href="/" id="brand-link">DropFix</a></h1>
    <nav class="topnav">
      <a href="/">Home</a>
      <a href="/search">Search</a>
      <a href="/about">About</a>
      <a href="/tools" class="tools-link">Tools</a>
    </nav>
  </div>
</header>

<main>
  <div class="home-toolbar">
    <button id="refresh-all-btn" class="secondary" type="button">Refresh (clear all 3 boxes)</button>
  </div>

  <div class="home-grid">

    <section class="box" id="repair-box">
      <h2>Repair</h2>
      <p class="box-subtitle">New repair ticket</p>
      <form id="repair-form">
        <div class="field-row">
          <label>Name
            <input type="text" name="name" required autocomplete="off">
          </label>
          <label>Phone
            <input type="text" name="phone" autocomplete="off">
          </label>
        </div>
        <div class="field-row">
          <label>Passcode
            <input type="text" name="passcode" autocomplete="off">
          </label>
          <label>Model
            <input type="text" name="model" required autocomplete="off">
          </label>
        </div>
        <label>Fault
          <select name="fault" id="repair-fault" required></select>
        </label>
        <label id="repair-fault-other-label" class="hidden">Other (describe)
          <input type="text" name="fault_other" autocomplete="off">
        </label>
        <label>Price (<span class="currency-symbol">&pound;</span>)
          <input type="text" name="price" inputmode="decimal" autocomplete="off" placeholder="keep it blank if not agreed yet">
        </label>
        <button type="submit" id="repair-submit-btn" class="full">Save repair ticket</button>
      </form>
      <div id="repair-confirmation" class="confirmation hidden"></div>
      <div id="repair-error" class="error hidden"></div>
    </section>

    <section class="box" id="sale-box">
      <h2>Sale</h2>
      <p class="box-subtitle">Quick counter sale</p>
      <form id="sale-form">
        <div class="field-row">
          <label>Name
            <input type="text" name="name" required autocomplete="off">
          </label>
          <label>Item
            <select name="item" id="sale-item" required></select>
          </label>
        </div>
        <label id="sale-custom-item-label" class="hidden">Custom item
          <input type="text" name="custom_item" autocomplete="off">
        </label>
        <div class="field-row">
          <label>IMEI / Serial
            <input type="text" name="serial" autocomplete="off">
          </label>
          <label>Price (<span class="currency-symbol">&pound;</span>)
            <input type="text" name="price" inputmode="decimal" required autocomplete="off">
          </label>
        </div>
        <label>Payment method</label>
        <div class="pair-row" id="sale-method-row">
          <button type="button" class="btn-toggle" data-value="Cash">Cash</button>
          <button type="button" class="btn-toggle" data-value="Card">Card</button>
        </div>
        <input type="hidden" name="method" id="sale-method-input" required>
        <button type="submit" id="sale-submit-btn" class="full">Save sale</button>
      </form>
      <div id="sale-confirmation" class="confirmation hidden"></div>
      <div id="sale-error" class="error hidden"></div>
    </section>

    <section class="box" id="paste-box">
      <h2>Paste &amp; Print</h2>
      <p class="box-subtitle">Paste, format, print -- nothing saved</p>
      <form id="paste-form">
        <label>Paste text here
          <textarea id="voucher-text" placeholder="Paste voucher text..."></textarea>
        </label>
        <button id="voucher-print-btn" class="full" type="button">Print</button>
      </form>
      <div id="voucher-confirmation" class="confirmation hidden"></div>
      <div id="voucher-error" class="error hidden"></div>
    </section>

  </div>
</main>

<div id="modal-root"></div>

<script src="https://cdn.jsdelivr.net/npm/qz-tray/qz-tray.js"></script>
<script src="/static/api.js"></script>
<script src="/static/pwa.js"></script>
<script src="/static/util.js"></script>
<script src="/static/common.js"></script>
<script src="/static/printing.js"></script>
<script src="/static/suggest.js"></script>
<script src="/static/repair-box.js"></script>
<script src="/static/sale-box.js"></script>
<script src="/static/paste-box.js"></script>
<script src="/static/home.js"></script>
</body>
</html>
